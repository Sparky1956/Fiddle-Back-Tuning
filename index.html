<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Fiddle Back Tones</title>
  <style>
    body {
      font-size: 20px;
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 30px;
    }
    label {
      font-size: 22px;
    }
    select, input[type=range], button {
      font-size: 20px;
      margin: 10px;
    }
    #freqDisplay {
      font-weight: bold;
      font-size: 24px;
    }
  </style>
</head>
<body>

  <!-- Centered title block -->
  <div style="margin-bottom:20px;">
    <h2>Jon set this up for Jim to tune fiddle backs</h2>
    <p>
      Choose a note and press <strong>Play tone</strong>.<br>
      You can move the tone a little with the slider.
    </p>
  </div>
  <hr>

  <h1>Fiddle Back Tones</h1>

  <!-- Frequency slider (55 Hz to 880 Hz) -->
  <label for="freqSlider">Frequency (55–880 Hz):</label><br>
  <input type="range" id="freqSlider" min="55" max="880" value="220" step="1" style="width:70%;">
  <div>Selected frequency: <span id="freqDisplay">220</span> Hz</div>

  <br><br>

  <!-- Pitch shift slider in cents -->
  <label for="pitchShift">Pitch shift (cents):</label><br>
  <input type="range" id="pitchShift" min="-200" max="200" value="0" step="1" style="width:70%;">
  <div><span id="pitchShiftValue">0</span> cents</div>

  <br><br>

  <!-- Play / stop buttons -->
  <button id="playBtn">Play tone</button>
  <button id="stopBtn" disabled>Stop</button>

  <script>
    let audioCtx = null;
    let osc = null;

    const freqSlider = document.getElementById('freqSlider');
    const pitchShift = document.getElementById('pitchShift');
    const pitchShiftValue = document.getElementById('pitchShiftValue');
    const freqDisplay = document.getElementById('freqDisplay');
    const playBtn = document.getElementById('playBtn');
    const stopBtn = document.getElementById('stopBtn');

    function centsToRatio(cents) {
      return Math.pow(2, cents / 1200);
    }

    function updateFrequencyDisplay() {
      const baseFreq = parseFloat(freqSlider.value);
      const cents = parseFloat(pitchShift.value);
      const ratio = centsToRatio(cents);
      const effFreq = baseFreq * ratio;

      freqDisplay.textContent = effFreq.toFixed(2);
      pitchShiftValue.textContent = cents;

      if (osc) {
        osc.frequency.setValueAtTime(effFreq, audioCtx.currentTime);
      }
    }

    freqSlider.addEventListener('input', updateFrequencyDisplay);
    pitchShift.addEventListener('input', updateFrequencyDisplay);

    playBtn.addEventListener('click', () => {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (osc) {
        osc.stop();
        osc.disconnect();
      }

      const baseFreq = parseFloat(freqSlider.value);
      const cents = parseFloat(pitchShift.value);
      const ratio = centsToRatio(cents);
      const effFreq = baseFreq * ratio;

      osc = audioCtx.createOscillator();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(effFreq, audioCtx.currentTime);
      osc.connect(audioCtx.destination);
      osc.start();

      freqDisplay.textContent = effFreq.toFixed(2);
      pitchShiftValue.textContent = cents;

      playBtn.disabled = true;
      stopBtn.disabled = false;
    });

    stopBtn.addEventListener('click', () => {
      if (osc) {
        osc.stop();
        osc.disconnect();
        osc = null;
      }
      playBtn.disabled = false;
      stopBtn.disabled = true;
    });

    updateFrequencyDisplay();
  </script>

</body>
</html>
