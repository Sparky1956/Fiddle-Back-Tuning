<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fiddle Back Tones</title>
  <style>
    body {
      font-size: 20px;
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 30px;
    }
    label {
      font-size: 22px;
    }
    select, input[type=range], button {
      font-size: 20px;
      margin: 10px;
    }
    button {
      padding: 8px 18px;
    }
    #freq1Display, #freq2Display {
      font-weight: bold;
      font-size: 24px;
    }
    .checkbox-label {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }
    .checkbox-label input[type=checkbox] {
      width: 28px;
      height: 28px;
      cursor: pointer;
    }
    .disabled {
      opacity: 0.4;
    }

    /* Bigger sliders */
    .big-slider {
      width: 180%;
      max-width: 1000px;
    }
    .slider-container {
      display: flex;
      justify-content: center;
      width: 100%;
      overflow: visible;
    }

    /* Larger slider thumbs */
    input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      height: 44px;
      background: transparent;
      cursor: pointer;
    }
    input[type=range]:disabled {
      cursor: not-allowed;
    }
    input[type=range]::-webkit-slider-runnable-track {
      height: 10px;
      background: #ccc;
      border-radius: 5px;
    }
    input[type=range]::-moz-range-track {
      height: 10px;
      background: #ccc;
      border-radius: 5px;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 40px;
      height: 40px;
      margin-top: -15px; /* centre thumb on the 10px track */
      border-radius: 50%;
      background: #2a6fdb;
      border: 3px solid #fff;
      box-shadow: 0 0 4px rgba(0, 0, 0, 0.5);
    }
    input[type=range]::-moz-range-thumb {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #2a6fdb;
      border: 3px solid #fff;
      box-shadow: 0 0 4px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body>

  <div style="margin-bottom:20px;">
    <h2>Jon set this up for Jim to tune fiddle backs</h2>
    <p>
      Choose a note and press <strong>Play tone</strong>.<br>
      Plays a pure sine tone by default. Tick <strong>Beat oscillator</strong>
      to add a second tone and hear beating.
    </p>
  </div>
  <hr>

  <h1>Fiddle Back Tones</h1>

  <!-- Note selector: A1 (55 Hz) up to A5 (880 Hz) -->
  <label for="noteSelect">Choose a note:</label><br>
  <select id="noteSelect">
    <option value="55.00">A1 (55 Hz)</option>
    <option value="58.27">A#1/Bb1 (58.27 Hz)</option>
    <option value="61.74">B1 (61.74 Hz)</option>

    <option value="65.41">C2 (65.41 Hz)</option>
    <option value="69.30">C#2/Db2 (69.30 Hz)</option>
    <option value="73.42">D2 (73.42 Hz)</option>
    <option value="77.78">D#2/Eb2 (77.78 Hz)</option>
    <option value="82.41">E2 (82.41 Hz)</option>
    <option value="87.31">F2 (87.31 Hz)</option>
    <option value="92.50">F#2/Gb2 (92.50 Hz)</option>
    <option value="98.00">G2 (98.00 Hz)</option>
    <option value="103.83">G#2/Ab2 (103.83 Hz)</option>

    <option value="110.00">A2 (110 Hz)</option>
    <option value="116.54">A#2/Bb2 (116.54 Hz)</option>
    <option value="123.47">B2 (123.47 Hz)</option>

    <option value="130.81">C3 (130.81 Hz)</option>
    <option value="138.59">C#3/Db3 (138.59 Hz)</option>
    <option value="146.83">D3 (146.83 Hz)</option>
    <option value="155.56">D#3/Eb3 (155.56 Hz)</option>
    <option value="164.81">E3 (164.81 Hz)</option>
    <option value="174.61">F3 (174.61 Hz)</option>
    <option value="185.00">F#3/Gb3 (185.00 Hz)</option>
    <option value="196.00">G3 (196.00 Hz)</option>
    <option value="207.65">G#3/Ab3 (207.65 Hz)</option>

    <option value="220.00">A3 (220 Hz)</option>
    <option value="233.08">A#3/Bb3 (233.08 Hz)</option>
    <option value="246.94">B3 (246.94 Hz)</option>

    <option value="261.63">C4 (261.63 Hz)</option>
    <option value="277.18">C#4/Db4 (277.18 Hz)</option>
    <option value="293.66">D4 (293.66 Hz)</option>
    <option value="311.13">D#4/Eb4 (311.13 Hz)</option>
    <option value="329.63">E4 (329.63 Hz)</option>
    <option value="349.23">F4 (349.23 Hz)</option>
    <option value="369.99">F#4/Gb4 (369.99 Hz)</option>
    <option value="392.00">G4 (392.00 Hz)</option>
    <option value="415.30">G#4/Ab4 (415.30 Hz)</option>

    <option value="440.00">A4 (440 Hz)</option>
    <option value="466.16">A#4/Bb4 (466.16 Hz)</option>
    <option value="493.88">B4 (493.88 Hz)</option>

    <option value="523.25">C5 (523.25 Hz)</option>
    <option value="554.37">C#5/Db5 (554.37 Hz)</option>
    <option value="587.33">D5 (587.33 Hz)</option>
    <option value="622.25">D#5/Eb5 (622.25 Hz)</option>
    <option value="659.25">E5 (659.25 Hz)</option>
    <option value="698.46">F5 (698.46 Hz)</option>
    <option value="739.99">F#5/Gb5 (739.99 Hz)</option>
    <option value="783.99">G5 (783.99 Hz)</option>
    <option value="830.61">G#5/Ab5 (830.61 Hz)</option>

    <option value="880.00">A5 (880 Hz)</option>
  </select>

  <br><br>

  <!-- Slider 1: detune in cents -->
  <label for="detune1">Detune (cents):</label><br>
  <div class="slider-container">
    <input type="range" id="detune1" min="-200" max="200" value="0" step="1" class="big-slider">
  </div>
  <div><span id="detune1Value">0</span> cents</div>

  <br>

  <!-- Volume -->
  <label for="volume">Volume:</label><br>
  <div class="slider-container">
    <input type="range" id="volume" min="0" max="100" value="50" step="1" class="big-slider">
  </div>
  <div><span id="volumeValue">50</span> %</div>

  <br>

  <!-- Beat oscillator toggle (off = pure sine) -->
  <label class="checkbox-label" for="beatEnable">
    <input type="checkbox" id="beatEnable">
    Beat oscillator
  </label>

  <br><br>

  <!-- Slider 2: beat detune in Hz -->
  <div id="beatSection" class="disabled">
    <label for="detune2">Beat detune (Hz):</label><br>
    <div class="slider-container">
      <input type="range" id="detune2" min="-5" max="5" value="0" step="0.1" class="big-slider" disabled>
    </div>
    <div><span id="detune2Value">0.0</span> Hz</div>
  </div>

  <br>

  <div>
    Osc 1 frequency: <span id="freq1Display">55.00</span> Hz<br>
    Osc 2 frequency: <span id="freq2Display">off</span><span id="freq2Unit"></span>
  </div>

  <br>

  <button id="playBtn">Play tone</button>
  <button id="stopBtn" disabled>Stop</button>
  <button id="resetBtn">Reset</button>

  <script>
    const RAMP = 0.03; // seconds; short fades avoid clicks

    let audioCtx = null;
    let masterGain = null;
    let osc1 = null;
    let osc2 = null;
    let osc2Gain = null;
    let playing = false;

    const noteSelect = document.getElementById('noteSelect');
    const detune1 = document.getElementById('detune1');
    const detune2 = document.getElementById('detune2');
    const volume = document.getElementById('volume');
    const beatEnable = document.getElementById('beatEnable');
    const beatSection = document.getElementById('beatSection');

    const detune1Value = document.getElementById('detune1Value');
    const detune2Value = document.getElementById('detune2Value');
    const volumeValue = document.getElementById('volumeValue');

    const freq1Display = document.getElementById('freq1Display');
    const freq2Display = document.getElementById('freq2Display');
    const freq2Unit = document.getElementById('freq2Unit');

    const playBtn = document.getElementById('playBtn');
    const stopBtn = document.getElementById('stopBtn');
    const resetBtn = document.getElementById('resetBtn');

    function centsToRatio(cents) {
      return Math.pow(2, cents / 1200);
    }

    function getFrequencies() {
      const baseFreq = parseFloat(noteSelect.value);
      const cents = parseFloat(detune1.value);
      const beatHz = parseFloat(detune2.value);
      const freq1 = baseFreq * centsToRatio(cents);
      const freq2 = freq1 + beatHz;
      return { cents, beatHz, freq1, freq2 };
    }

    // Master volume. When both oscillators play, halve the level so the
    // sum doesn't clip and the overall loudness stays similar.
    function targetMasterLevel() {
      const v = parseFloat(volume.value) / 100;
      return beatEnable.checked ? v * 0.5 : v;
    }

    function rampParam(param, value) {
      const now = audioCtx.currentTime;
      param.cancelScheduledValues(now);
      param.setValueAtTime(param.value, now);
      param.linearRampToValueAtTime(value, now + RAMP);
    }

    function updateDisplay() {
      const { cents, beatHz, freq1, freq2 } = getFrequencies();

      detune1Value.textContent = cents;
      detune2Value.textContent = beatHz.toFixed(1);
      volumeValue.textContent = volume.value;

      freq1Display.textContent = freq1.toFixed(2);
      if (beatEnable.checked) {
        freq2Display.textContent = freq2.toFixed(2);
        freq2Unit.textContent = ' Hz';
      } else {
        freq2Display.textContent = 'off';
        freq2Unit.textContent = '';
      }

      detune2.disabled = !beatEnable.checked;
      beatSection.classList.toggle('disabled', !beatEnable.checked);
    }

    function updateAudio() {
      if (!playing) return;
      const { freq1, freq2 } = getFrequencies();
      const now = audioCtx.currentTime;
      if (osc1) osc1.frequency.setValueAtTime(freq1, now);
      if (osc2) osc2.frequency.setValueAtTime(freq2, now);
      rampParam(masterGain.gain, targetMasterLevel());
    }

    function update() {
      updateDisplay();
      updateAudio();
    }

    function startOsc2() {
      if (osc2) return;
      const { freq2 } = getFrequencies();
      osc2Gain = audioCtx.createGain();
      osc2Gain.gain.setValueAtTime(0, audioCtx.currentTime);
      osc2Gain.connect(masterGain);

      osc2 = audioCtx.createOscillator();
      osc2.type = 'sine';
      osc2.frequency.setValueAtTime(freq2, audioCtx.currentTime);
      osc2.connect(osc2Gain);
      osc2.start();

      rampParam(osc2Gain.gain, 1);
    }

    function stopOsc2() {
      if (!osc2) return;
      const o = osc2;
      const g = osc2Gain;
      osc2 = null;
      osc2Gain = null;
      rampParam(g.gain, 0);
      o.stop(audioCtx.currentTime + RAMP + 0.01);
      o.onended = () => { o.disconnect(); g.disconnect(); };
    }

    noteSelect.addEventListener('change', update);
    detune1.addEventListener('input', update);
    detune2.addEventListener('input', update);
    volume.addEventListener('input', update);

    beatEnable.addEventListener('change', () => {
      if (playing) {
        if (beatEnable.checked) startOsc2(); else stopOsc2();
      }
      update();
    });

    playBtn.addEventListener('click', () => {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        masterGain = audioCtx.createGain();
        masterGain.gain.value = 0;
        masterGain.connect(audioCtx.destination);
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();

      const { freq1 } = getFrequencies();

      osc1 = audioCtx.createOscillator();
      osc1.type = 'sine';
      osc1.frequency.setValueAtTime(freq1, audioCtx.currentTime);
      osc1.connect(masterGain);
      osc1.start();

      playing = true;
      if (beatEnable.checked) startOsc2();

      rampParam(masterGain.gain, targetMasterLevel());

      playBtn.disabled = true;
      stopBtn.disabled = false;

      update();
    });

    stopBtn.addEventListener('click', () => {
      if (!playing) return;
      playing = false;

      rampParam(masterGain.gain, 0);
      const stopAt = audioCtx.currentTime + RAMP + 0.01;

      if (osc1) {
        const o = osc1;
        osc1 = null;
        o.stop(stopAt);
        o.onended = () => o.disconnect();
      }
      if (osc2) {
        const o = osc2;
        const g = osc2Gain;
        osc2 = null;
        osc2Gain = null;
        o.stop(stopAt);
        o.onended = () => { o.disconnect(); g.disconnect(); };
      }

      playBtn.disabled = false;
      stopBtn.disabled = true;
    });

    // Reset sliders and beat oscillator to defaults (keeps the chosen note).
    resetBtn.addEventListener('click', () => {
      detune1.value = 0;
      detune2.value = 0;
      volume.value = 50;
      if (beatEnable.checked) {
        beatEnable.checked = false;
        if (playing) stopOsc2();
      }
      update();
    });

    updateDisplay();
  </script>

</body>
</html>
