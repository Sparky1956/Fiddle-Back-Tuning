<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Fiddle Back Tones</title>
  <style>
    body {
      font-size: 20px;
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 30px;
    }
    label {
      font-size: 22px;
    }
    select, input[type=range], button {
      font-size: 20px;
      margin: 10px;
    }
    #freq1Display, #freq2Display {
      font-weight: bold;
      font-size: 24px;
    }

    /* Bigger sliders */
    .big-slider {
      width: 180%;
      max-width: 1000px;
    }
    .slider-container {
      display: flex;
      justify-content: center;
      width: 100%;
      overflow: visible;
    }
  </style>
</head>
<body>

  <div style="margin-bottom:20px;">
    <h2>Jon set this up for Jim to tune fiddle backs</h2>
    <p>
      Choose a note and press <strong>Play tone</strong>.<br>
      Use the sliders to explore resonance and beating.
    </p>
  </div>
  <hr>

  <h1>Fiddle Back Tones — Dual Oscillator Beats</h1>

  <!-- Note selector: A1 (55 Hz) up to A5 (880 Hz) -->
  <label for="noteSelect">Choose a note:</label><br>
  <select id="noteSelect">
    <option value="55.00">A1 (55 Hz)</option>
    <option value="58.27">A#1/Bb1 (58.27 Hz)</option>
    <option value="61.74">B1 (61.74 Hz)</option>

    <option value="65.41">C2 (65.41 Hz)</option>
    <option value="69.30">C#2/Db2 (69.30 Hz)</option>
    <option value="73.42">D2 (73.42 Hz)</option>
    <option value="77.78">D#2/Eb2 (77.78 Hz)</option>
    <option value="82.41">E2 (82.41 Hz)</option>
    <option value="87.31">F2 (87.31 Hz)</option>
    <option value="92.50">F#2/Gb2 (92.50 Hz)</option>
    <option value="98.00">G2 (98.00 Hz)</option>
    <option value="103.83">G#2/Ab2 (103.83 Hz)</option>

    <option value="110.00">A2 (110 Hz)</option>
    <option value="116.54">A#2/Bb2 (116.54 Hz)</option>
    <option value="123.47">B2 (123.47 Hz)</option>

    <option value="130.81">C3 (130.81 Hz)</option>
    <option value="138.59">C#3/Db3 (138.59 Hz)</option>
    <option value="146.83">D3 (146.83 Hz)</option>
    <option value="155.56">D#3/Eb3 (155.56 Hz)</option>
    <option value="164.81">E3 (164.81 Hz)</option>
    <option value="174.61">F3 (174.61 Hz)</option>
    <option value="185.00">F#3/Gb3 (185.00 Hz)</option>
    <option value="196.00">G3 (196.00 Hz)</option>
    <option value="207.65">G#3/Ab3 (207.65 Hz)</option>

    <option value="220.00">A3 (220 Hz)</option>
    <option value="233.08">A#3/Bb3 (233.08 Hz)</option>
    <option value="246.94">B3 (246.94 Hz)</option>

    <option value="261.63">C4 (261.63 Hz)</option>
    <option value="277.18">C#4/Db4 (277.18 Hz)</option>
    <option value="293.66">D4 (293.66 Hz)</option>
    <option value="311.13">D#4/Eb4 (311.13 Hz)</option>
    <option value="329.63">E4 (329.63 Hz)</option>
    <option value="349.23">F4 (349.23 Hz)</option>
    <option value="369.99">F#4/Gb4 (369.99 Hz)</option>
    <option value="392.00">G4 (392.00 Hz)</option>
    <option value="415.30">G#4/Ab4 (415.30 Hz)</option>

    <option value="440.00">A4 (440 Hz)</option>
    <option value="466.16">A#4/Bb4 (466.16 Hz)</option>
    <option value="493.88">B4 (493.88 Hz)</option>

    <option value="523.25">C5 (523.25 Hz)</option>
    <option value="554.37">C#5/Db5 (554.37 Hz)</option>
    <option value="587.33">D5 (587.33 Hz)</option>
    <option value="622.25">D#5/Eb5 (622.25 Hz)</option>
    <option value="659.25">E5 (659.25 Hz)</option>
    <option value="698.46">F5 (698.46 Hz)</option>
    <option value="739.99">F#5/Gb5 (739.99 Hz)</option>
    <option value="783.99">G5 (783.99 Hz)</option>
    <option value="830.61">G#5/Ab5 (830.61 Hz)</option>

    <option value="880.00">A5 (880 Hz)</option>
  </select>

  <br><br>

  <!-- Slider 1: detune in cents -->
  <label for="detune1">Detune (cents):</label><br>
  <div class="slider-container">
    <input type="range" id="detune1" min="-200" max="200" value="0" step="1" class="big-slider">
  </div>
  <div><span id="detune1Value">0</span> cents</div>

  <br><br>

  <!-- Slider 2: beat detune in Hz -->
  <label for="detune2">Beat detune (Hz):</label><br>
  <div class="slider-container">
    <input type="range" id="detune2" min="-10" max="10" value="0" step="0.1" class="big-slider">
  </div>
  <div><span id="detune2Value">0.0</span> Hz</div>

  <br><br>

  <div>
    Osc 1 frequency: <span id="freq1Display">55.00</span> Hz<br>
    Osc 2 frequency: <span id="freq2Display">55.00</span> Hz
  </div>

  <br>

  <button id="playBtn">Play tone</button>
  <button id="stopBtn" disabled>Stop</button>

  <script>
    let audioCtx = null;
    let osc1 = null;
    let osc2 = null;

    const noteSelect = document.getElementById('noteSelect');
    const detune1 = document.getElementById('detune1');
    const detune2 = document.getElementById('detune2');

    const detune1Value = document.getElementById('detune1Value');
    const detune2Value = document.getElementById('detune2Value');

    const freq1Display = document.getElementById('freq1Display');
    const freq2Display = document.getElementById('freq2Display');

    const playBtn = document.getElementById('playBtn');
    const stopBtn = document.getElementById('stopBtn');

    function centsToRatio(cents) {
      return Math.pow(2, cents / 1200);
    }

    function updateFrequencies() {
      const baseFreq = parseFloat(noteSelect.value);
      const cents = parseFloat(detune1.value);
      const beatHz = parseFloat(detune2.value);

      const freq1 = baseFreq * centsToRatio(cents);
      const freq2 = freq1 + beatHz;

      freq1Display.textContent = freq1.toFixed(2);
      freq2Display.textContent = freq2.toFixed(2);

      detune1Value.textContent = cents;
      detune2Value.textContent = beatHz.toFixed(1);

      if (osc1) osc1.frequency.setValueAtTime(freq1, audioCtx.currentTime);
      if (osc2) osc2.frequency.setValueAtTime(freq2, audioCtx.currentTime);
    }

    noteSelect.addEventListener('change', updateFrequencies);
    detune1.addEventListener('input', updateFrequencies);
    detune2.addEventListener('input', updateFrequencies);

    playBtn.addEventListener('click', () => {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }

      if (osc1) { osc1.stop(); osc1.disconnect(); }
      if (osc2) { osc2.stop(); osc2.disconnect(); }

      const baseFreq = parseFloat(noteSelect.value);
      const cents = parseFloat(detune1.value);
      const beatHz = parseFloat(detune2.value);

      const freq1 = baseFreq * centsToRatio(cents);
      const freq2 = freq1 + beatHz;

      osc1 = audioCtx.createOscillator();
      osc2 = audioCtx.createOscillator();

      osc1.type = "sine";
      osc2.type = "sine";

      osc1.frequency.setValueAtTime(freq1, audioCtx.currentTime);
      osc2.frequency.setValueAtTime(freq2, audioCtx.currentTime);

      osc1.connect(audioCtx.destination);
      osc2.connect(audioCtx.destination);

      osc1.start();
      osc2.start();

      playBtn.disabled = true;
      stopBtn.disabled = false;

      updateFrequencies();
    });

    stopBtn.addEventListener('click', () => {
      if (osc1) { osc1.stop(); osc1.disconnect(); osc1 = null; }
      if (osc2) { osc2.stop(); osc2.disconnect(); osc2 = null; }

      playBtn.disabled = false;
      stopBtn.disabled = true;
    });

    updateFrequencies();
  </script>

</body>
</html>
