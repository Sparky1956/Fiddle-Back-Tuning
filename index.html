<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Fiddle Back Tones</title>
</head>
<body>
  <h1>Fiddle Back Tones</h1>

  <!-- Base pitch selection -->
  <label for="baseNote">Base note:</label>
  <select id="baseNote">
    <option value="196">G3 (196 Hz)</option>
    <option value="220">A3 (220 Hz)</option>
    <option value="246.94">B3 (246.94 Hz)</option>
    <option value="261.63">C4 (261.63 Hz)</option>
    <option value="293.66">D4 (293.66 Hz)</option>
    <option value="329.63">E4 (329.63 Hz)</option>
    <option value="392">G4 (392 Hz)</option>
  </select>

  <br><br>

  <!-- Pitch shift slider in cents -->
  <label for="pitchShift">Pitch shift (cents): </label>
  <input type="range" id="pitchShift" min="-200" max="200" value="0" step="1">
  <span id="pitchShiftValue">0</span> cents

  <br><br>

  <!-- Display effective frequency -->
  <div>
    Effective frequency: <span id="freqDisplay">220</span> Hz
  </div>

  <br>

  <!-- Play / stop buttons -->
  <button id="playBtn">Play tone</button>
  <button id="stopBtn" disabled>Stop</button>

  <script>
    let audioCtx = null;
    let osc = null;

    const baseNote = document.getElementById('baseNote');
    const pitchShift = document.getElementById('pitchShift');
    const pitchShiftValue = document.getElementById('pitchShiftValue');
    const freqDisplay = document.getElementById('freqDisplay');
    const playBtn = document.getElementById('playBtn');
    const stopBtn = document.getElementById('stopBtn');

    function centsToRatio(cents) {
      // 1200 cents = 1 octave = factor 2
      return Math.pow(2, cents / 1200);
    }

    function updateFrequencyDisplay() {
      const baseFreq = parseFloat(baseNote.value);
      const cents = parseFloat(pitchShift.value);
      const ratio = centsToRatio(cents);
      const effFreq = baseFreq * ratio;
      freqDisplay.textContent = effFreq.toFixed(2);
      pitchShiftValue.textContent = cents;
      if (osc) {
        osc.frequency.setValueAtTime(effFreq, audioCtx.currentTime);
      }
    }

    baseNote.addEventListener('change', updateFrequencyDisplay);
    pitchShift.addEventListener('input', updateFrequencyDisplay);

    playBtn.addEventListener('click', () => {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (osc) {
        osc.stop();
        osc.disconnect();
      }
      const baseFreq = parseFloat(baseNote.value);
      const cents = parseFloat(pitchShift.value);
      const ratio = centsToRatio(cents);
      const effFreq = baseFreq * ratio;

      osc = audioCtx.createOscillator();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(effFreq, audioCtx.currentTime);
      osc.connect(audioCtx.destination);
      osc.start();

      freqDisplay.textContent = effFreq.toFixed(2);
      pitchShiftValue.textContent = cents;

      playBtn.disabled = true;
      stopBtn.disabled = false;
    });

    stopBtn.addEventListener('click', () => {
      if (osc) {
        osc.stop();
        osc.disconnect();
        osc = null;
      }
      playBtn.disabled = false;
      stopBtn.disabled = true;
    });

    // Initialize display
    updateFrequencyDisplay();
  </script>
</body>
</html>
