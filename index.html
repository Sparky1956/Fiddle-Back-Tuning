<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Fiddle Back Tones</title>
  <style>
    body {
      font-size: 20px;
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 30px;
    }
    label {
      font-size: 22px;
    }
    select, input[type=range], button {
      font-size: 20px;
      margin: 10px;
    }
    #freqDisplay {
      font-weight: bold;
      font-size: 24px;
    }
  </style>
</head>
<body>

  <!-- Centered title block -->
  <div style="margin-bottom:20px;">
    <h2>Jon set this up for Jim to tune fiddle backs</h2>
    <p>
      Choose a note and press <strong>Play tone</strong>.<br>
      You can move the tone a little with the slider.
    </p>
  </div>
  <hr>

  <h1>Fiddle Back Tones</h1>

  <!-- Note selector A2–A6 -->
  <label for="noteSelect">Choose a note:</label><br>
  <select id="noteSelect">
    <!-- A2 to A6, chromatic -->
    <option value="110">A2 (110 Hz)</option>
    <option value="116.54">A#2/Bb2 (116.54 Hz)</option>
    <option value="123.47">B2 (123.47 Hz)</option>

    <option value="130.81">C3 (130.81 Hz)</option>
    <option value="138.59">C#3/Db3 (138.59 Hz)</option>
    <option value="146.83">D3 (146.83 Hz)</option>
    <option value="155.56">D#3/Eb3 (155.56 Hz)</option>
    <option value="164.81">E3 (164.81 Hz)</option>
    <option value="174.61">F3 (174.61 Hz)</option>
    <option value="185.00">F#3/Gb3 (185.00 Hz)</option>
    <option value="196.00">G3 (196.00 Hz)</option>
    <option value="207.65">G#3/Ab3 (207.65 Hz)</option>

    <option value="220.00">A3 (220 Hz)</option>
    <option value="233.08">A#3/Bb3 (233.08 Hz)</option>
    <option value="246.94">B3 (246.94 Hz)</option>

    <option value="261.63">C4 (261.63 Hz)</option>
    <option value="277.18">C#4/Db4 (277.18 Hz)</option>
    <option value="293.66">D4 (293.66 Hz)</option>
    <option value="311.13">D#4/Eb4 (311.13 Hz)</option>
    <option value="329.63">E4 (329.63 Hz)</option>
    <option value="349.23">F4 (349.23 Hz)</option>
    <option value="369.99">F#4/Gb4 (369.99 Hz)</option>
    <option value="392.00">G4 (392.00 Hz)</option>
    <option value="415.30">G#4/Ab4 (415.30 Hz)</option>

    <option value="440.00">A4 (440 Hz)</option>
    <option value="466.16">A#4/Bb4 (466.16 Hz)</option>
    <option value="493.88">B4 (493.88 Hz)</option>

    <option value="523.25">C5 (523.25 Hz)</option>
    <option value="554.37">C#5/Db5 (554.37 Hz)</option>
    <option value="587.33">D5 (587.33 Hz)</option>
    <option value="622.25">D#5/Eb5 (622.25 Hz)</option>
    <option value="659.25">E5 (659.25 Hz)</option>
    <option value="698.46">F5 (698.46 Hz)</option>
    <option value="739.99">F#5/Gb5 (739.99 Hz)</option>
    <option value="783.99">G5 (783.99 Hz)</option>
    <option value="830.61">G#5/Ab5 (830.61 Hz)</option>

    <option value="880.00">A5 (880 Hz)</option>
    <option value="932.33">A#5/Bb5 (932.33 Hz)</option>
    <option value="987.77">B5 (987.77 Hz)</option>

    <option value="1046.50">C6 (1046.50 Hz)</option>
    <option value="1108.73">C#6/Db6 (1108.73 Hz)</option>
    <option value="1174.66">D6 (1174.66 Hz)</option>
    <option value="1244.51">D#6/Eb6 (1244.51 Hz)</option>
    <option value="1318.51">E6 (1318.51 Hz)</option>
    <option value="1396.91">F6 (1396.91 Hz)</option>
    <option value="1479.98">F#6/Gb6 (1479.98 Hz)</option>
    <option value="1567.98">G6 (1567.98 Hz)</option>
    <option value="1661.22">G#6/Ab6 (1661.22 Hz)</option>

    <option value="1760.00">A6 (1760 Hz)</option>
  </select>

  <br><br>

  <!-- Pitch shift slider -->
  <label for="pitchShift">Pitch shift (cents):</label><br>
  <input type="range" id="pitchShift" min="-200" max="200" value="0" step="1" style="width:70%;">
  <div><span id="pitchShiftValue">0</span> cents</div>

  <br><br>

  <!-- Effective frequency -->
  <div>Effective frequency: <span id="freqDisplay">110</span> Hz</div>

  <br>

  <!-- Play / stop buttons -->
  <button id="playBtn">Play tone</button>
  <button id="stopBtn" disabled>Stop</button>

  <script>
    let audioCtx = null;
    let osc = null;

    const noteSelect = document.getElementById('noteSelect');
    const pitchShift = document.getElementById('pitchShift');
    const pitchShiftValue = document.getElementById('pitchShiftValue');
    const freqDisplay = document.getElementById('freqDisplay');
    const playBtn = document.getElementById('playBtn');
    const stopBtn = document.getElementById('stopBtn');

    function centsToRatio(cents) {
      return Math.pow(2, cents / 1200);
    }

    function updateFrequencyDisplay() {
      const baseFreq = parseFloat(noteSelect.value);
      const cents = parseFloat(pitchShift.value);
      const ratio = centsToRatio(cents);
      const effFreq = baseFreq * ratio;

      freqDisplay.textContent = effFreq.toFixed(2);
      pitchShiftValue.textContent = cents;

      if (osc) {
        osc.frequency.setValueAtTime(effFreq, audioCtx.currentTime);
      }
    }

    noteSelect.addEventListener('change', updateFrequencyDisplay);
    pitchShift.addEventListener('input', updateFrequencyDisplay);

    playBtn.addEventListener('click', () => {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (osc) {
        osc.stop();
        osc.disconnect();
      }

      const baseFreq = parseFloat(noteSelect.value);
      const cents = parseFloat(pitchShift.value);
      const ratio = centsToRatio(cents);
      const effFreq = baseFreq * ratio;

      osc = audioCtx.createOscillator();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(effFreq, audioCtx.currentTime);
      osc.connect(audioCtx.destination);
      osc.start();

      freqDisplay.textContent = effFreq.toFixed(2);
      pitchShiftValue.textContent = cents;

      playBtn.disabled = true;
      stopBtn.disabled = false;
    });

    stopBtn.addEventListener('click', () => {
      if (osc) {
        osc.stop();
        osc.disconnect();
        osc = null;
      }
      playBtn.disabled = false;
      stopBtn.disabled = true;
    });

    updateFrequencyDisplay();
  </script>

</body>
</html>
